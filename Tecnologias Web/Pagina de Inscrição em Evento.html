<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom, #2c2c2c, #000);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(20, 20, 20, 0.95);
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 0 15px #aa00ff;
    }

    h1 {
      text-align: center;
      color: #00ffcc;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    input[type="radio"], input[type="checkbox"] {
      width: auto;
      margin-right: 5px;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    .btns {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .enviar {
      background: #00ffcc;
      color: #000;
    }

    .limpar {
      background: #ff4444;
      color: #fff;
    }

    .enviar:hover {
      background: #00cc99;
    }

    .limpar:hover {
      background: #cc0000;
    }

    .banner {
      text-align: center;
      margin-bottom: 20px;
    }

    .banner img {
      max-width: 100%;
      border-radius: 12px;
      width: 190px;
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <img src="https://i.postimg.cc/1RpcsvbM/unnamed.png" alt="Campeonato faça sua Inscrição">
        </div>
        <h1>Inscrição</h1>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>  

            <label for="nome">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="data">Data de Nascimento:</label>
            <input type="date" id="data" name="data" required>

            <label>Gênero</label>
            <input type="radio" name="genero" value="masculino" required> Masculino
            <input type="radio" name="genero" value="feminino" required> Feminino
            <input type="radio" name="genero" value="outro" required> Outro

            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Selecione</option>
                <option value="sp">São Paulo</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="mg">Minas Gerais</option>
                <option value="ac">Acre</option>
                <option value="to">Tocantins</option>
                <option value="ba">Bahia</option>
            </select>

            <label>Interesses:</label>
            <input type="checkbox" name="interesses" value="fps"> FPS
            <input type="checkbox" name="interesses" value="moba"> MOBA
            <input type="checkbox" name="interesses" value="rpg"> RPG
            <input type="checkbox" name="interesses" value="outros"> Outros

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem"></textarea>

            <div class="btns">
        <button type="submit" class="enviar">Enviar</button>
        <button type="reset" class="limpar">Limpar</button>
      </div>
        </form>
    </div>
</body>
</html>
