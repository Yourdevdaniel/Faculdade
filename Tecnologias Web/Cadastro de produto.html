<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produto</title>
    <style>
        body {
            background-color: #ccc;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .form-conteudo {
            width: 500px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
        }
        .color{
            width: 50px;

        }

        .form-grupo {
        margin-bottom: 20px;
        }
        label {
            font-weight: bold;
        }
        .text-bold {
            font-weight: bold;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .input-radio,
        .checkbox {
        width: auto;
        }
        button {
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        #btnCadastrar {
        background-color: #007bff;
        }
        #btnLimpar {
            background-color: #007bff;
        }
        #btnCadastrar:hover {
        background-color: #0056b3;
        }
        #btnLimpar:hover {
        background-color: #0056b3;
        }
        #btndisable {
            background-color: #696969 ;
        }
        #btndisable:hover {
            background-color: #3B3B3B;
        }
        h2 {
            text-align: center;
        }
        
    </style>
</head>
<body>
    <div class="form-conteudo">
        <form action="#" method="post">

            <h2>Cadastro de Produto</h2>
       
        <div class="form-grupo">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" name="nome" required maxlength="50" placeholder="Coloque o nome do produto">
        </div>
       
        <div class="form-grupo">
            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" required>
        </div>
       
        <div class="form-grupo">
            <label for="estoque">Quantidade em estoque:</label>
            <input type="numer" id="estoque" name="estoque" required min="0">
        </div>
       
        <div class="form-grupo">
         <label for="Categoria">Categoria:</label>
         <select id="Categoria" name="Categoria">
            <option value="selecione">Selecione</option>
          <option value="eletro">Eletrônicos</option>
          <option value="roupa">Roupas</option>
          <option value="brinquedos">Brinquedos</option>
         </select>
        </div>

        <div class="form-grupo">
            <label for="cor">Cor disponível:</label><br>
            <input class="color" type="color" id="cor" name="cor" required>
        </div>

        <div class="form-grupo">
            <label for="foto">Foto do produto</label>
            <input type="file" id="foto" name="foto" required accept="image/png, image/jpg">
        </div>
       
        <div class="form-grupo">
         <label for="desc">Descrição do produto:</label>
         <textarea id="desc" rows="4" cols="40" name="desc" maxlength="200" placeholder="Coloque a Descrição do produto">
         </textarea>
        </div>

        <div class="form-grupo">
            <input type="checkbox" class="checkbox" id="termos" name="termos"> <label for="termos" name="termos"><b>Produto em promoção</b></label>
        </div>
       
        <div class="form-grupo">
        <button type="submit" id="btnCadastrar" name="btnCadastrar">
        Cadastrar
        </button>
        <button type="button" id="btnLimpar" name="btnLimpar">
       Limpar
        </button>
        <button type="button" id="btndisable" name="disable">
            Botão desabilitado
        </button>
        </div>
       
        </form>
       </div>
    
</body>
</html>
